<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>withAG</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <div class="bar-main">
    <span class="dot" id="dot"></span>
    <strong>withAG</strong>
    <span class="sub" id="statusText">接続中…</span>
  </div>
  <button class="icon" id="infoBtn" aria-label="状態">ⓘ</button>
</header>

<div id="panel" class="panel hidden">
  <dl id="panelBody"></dl>
  <div class="panel-actions">
    <button id="reloadBtn">再読み込み</button>
    <button id="logoutBtn" class="ghost">トークン再設定</button>
  </div>
</div>

<main id="log" class="log"></main>

<div id="jump" class="jump hidden">↓ 最新</div>

<form id="composer" class="composer">
  <textarea id="input" rows="1" placeholder="Antigravity に送信…" autocomplete="off"></textarea>
  <button id="sendBtn" type="submit" aria-label="送信">➤</button>
</form>

<div id="gate" class="gate hidden">
  <div class="gate-box">
    <h1>withAG</h1>
    <p>PC の config.toml に設定した token を入力してください。</p>
    <input id="tokenInput" type="password" placeholder="token" autocomplete="off">
    <button id="tokenBtn">接続</button>
    <p class="err" id="gateErr"></p>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
